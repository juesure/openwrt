name: Build Redmi AX6 (256M)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: AX6_256M_FLASH_OPW_V1.0
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [AX6_256M_FLASH_OPW_V1.0]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理冗余文件
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # 安装依赖
          sudo apt update -y && sudo apt full-upgrade -y && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip gh lz4 lzop m4
          # 设置时区
          sudo timedatectl set-timezone "$TZ"
          # 创建目录 + 校验文件
          mkdir -p "$WORK_DIR" && chmod 777 "$WORK_DIR"
          [ ! -f "$DIY_SCRIPT" ] && { printf "❌ DIY脚本不存在\n"; exit 1; } && chmod +x "$DIY_SCRIPT"
          [ ! -f "$CONFIG_FILE" ] && { printf "❌ 配置文件不存在\n"; exit 1; }
          mkdir -p "$FIRMWARE_OUTPUT_DIR" && chmod 777 "$FIRMWARE_OUTPUT_DIR"

      - name: Clone Source
        run: |
          cd "$WORK_DIR" || { printf "❌ 进入工作目录失败\n"; exit 1; }
          for i in {1..3}; do git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt && break; rm -rf openwrt; sleep 5; done
          [ ! -d "$WORK_DIR/openwrt" ] && { printf "❌ 源码克隆失败\n"; exit 1; }
          ln -sf "$WORK_DIR/openwrt" /home/runner/work/openwrt/openwrt/openwrt
          chmod -R 755 "$WORK_DIR/openwrt"
          printf "✅ 源码克隆完成\n"

      - name: Preprocess
        run: |
          OPENWRT_SRC="$WORK_DIR/openwrt"
          cd "$OPENWRT_SRC" || exit 1
          printf "🔧 当前工作目录：%s\n" "$(pwd)"
          
          # 赋予DIY脚本可执行权限
          chmod +x "$DIY_SCRIPT"
          if [ ! -x "$DIY_SCRIPT" ]; then
              printf "❌ 赋予DIY脚本权限失败：%s\n" "$DIY_SCRIPT"
              exit 1
          fi
          
          # 执行DIY脚本
          "$DIY_SCRIPT" || {
              printf "❌ DIY脚本执行失败\n"
              exit 1
          }
          
          # 修复json文件
          JSON_FILE=$(find "$OPENWRT_SRC" -name "json_add_image_info.py" 2>/dev/null | head -1)
          if [ -n "$JSON_FILE" ]; then
              sed -i 's/return int(image_size)/return int(image_size, 0)/' "$JSON_FILE"
              printf "✅ 已修复：%s\n" "$JSON_FILE"
          else
              printf "⚠️ 未找到json_add_image_info.py，跳过修复\n"
          fi
          
          # 禁用fwupd
          printf "%s\n" "CONFIG_PACKAGE_fwupd=n" "CONFIG_PACKAGE_fwupd-libs=n" "CONFIG_FWUPD_PLUGIN_FLASHROM=n" >> "$OPENWRT_SRC/.config"
          
          # 覆盖配置文件
          cp "$CONFIG_FILE" "$OPENWRT_SRC/.config"
          
          # 生成defconfig
          make defconfig -e > /dev/null 2>&1
          printf "✅ Preprocess 步骤完成\n"

      - name: Compile
        id: compile
        run: |
          cd "$WORK_DIR/openwrt"
          
          echo "============================================="
          echo "        多线程详细编译（V=s）"
          echo "============================================="
          
          make -j$(nproc) V=s 2>&1 | tee compile.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo -e "\n❌ 编译失败，显示最后 200 行错误信息"
            tail -200 compile.log
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          FIRMWARE_DIR="$WORK_DIR/openwrt/bin/targets/qualcommax/ipq807x"
          if ls "$FIRMWARE_DIR"/*redmi_ax6*sysupgrade.bin 1>/dev/null 2>&1 || \
             ls "$FIRMWARE_DIR"/*redmi_ax6*.ubi 1>/dev/null 2>&1; then
            echo -e "\n✅ 固件编译成功！"
            echo "status=success" >> $GITHUB_OUTPUT
            echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
            ls -lh "$FIRMWARE_DIR"/*redmi_ax6*
          else
            echo -e "\n❌ 未找到固件文件"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate Firmware
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "$FIRMWARE_OUTPUT_DIR" || exit 1
          BUILD_TIME="${{ env.BUILD_TIME }}"
          
          # 列出所有生成的文件（调试用）
          echo "📂 编译输出目录内容："
          ls -lh
          
          # 准备发布目录
          mkdir -p /home/runner/firmware
          
          # 复制 sysupgrade.bin 文件
          cp *redmi_ax6*.bin /home/runner/firmware/ 2>/dev/null || true
          
          # 复制 UBI 文件（如果存在）
          cp *factory.ubi /home/runner/firmware/ 2>/dev/null || true
          cp *rootfs.ubi /home/runner/firmware/ 2>/dev/null || true
          
          # 如果既没有 factory.ubi 也没有 rootfs.ubi，尝试从 sysupgrade.bin 提取
          if ! ls /home/runner/firmware/*.ubi 1>/dev/null 2>&1; then
              SYSUPGRADE=$(ls *sysupgrade.bin | head -1)
              if [ -n "$SYSUPGRADE" ]; then
                  dd if="$SYSUPGRADE" of=/home/runner/firmware/redmi_ax6_full.ubi bs=1M skip=4
                  echo "✅ 已从 sysupgrade.bin 提取完整 UBI 镜像 (redmi_ax6_full.ubi)"
              fi
          fi
          
          # 发布 Release
          gh release create "AX6-256M-${BUILD_TIME}" --title "Redmi AX6 256M ${BUILD_TIME}" --notes "Redmi AX6 256M Firmware" /home/runner/firmware/* 2>/dev/null || printf "⚠️ Release已存在\n"
          printf "✅ 固件发布完成\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: "AX6-256M-Firmware-${{ env.BUILD_TIME }}"
          path: /home/runner/firmware/*
          retention-days: 30
