name: Build Redmi AX6 (256M)

on:
  push:
    branches: [juesure-patch-1]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: juesure-patch-1
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/openwrt/bin/targets/qualcommax/ipq807x

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip
          sudo timedatectl set-timezone "$TZ"
          mkdir -p $WORK_DIR && chmod 777 $WORK_DIR
          if [ ! -f "$DIY_SCRIPT" ]; then echo "DIY script not found"; exit 1; fi
          chmod +x $DIY_SCRIPT
          if [ ! -f "$CONFIG_FILE" ]; then echo "Config file not found"; exit 1; fi
          mkdir -p "$FIRMWARE_OUTPUT_DIR" && chmod 777 "$FIRMWARE_OUTPUT_DIR"

      - name: Clone Source
        run: |
          cd $WORK_DIR
          for i in {1..3}; do git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt && break; rm -rf openwrt; sleep 5; done
          if [ ! -d "$WORK_DIR/openwrt" ]; then exit 1; fi
          ln -sf $WORK_DIR/openwrt /home/runner/work/openwrt/openwrt/openwrt
          chmod -R 755 $WORK_DIR/openwrt

      - name: Preprocess
        run: |
          cd /home/runner/work/openwrt/openwrt/openwrt
          $DIY_SCRIPT || exit 1
          sed -i 's/return int(image_size)/return int(image_size, 0)/' scripts/json_add_image_info.py
          echo -e "CONFIG_PACKAGE_fwupd=n\nCONFIG_PACKAGE_fwupd-libs=n\nCONFIG_FWUPD_PLUGIN_FLASHROM=n" >> .config
          cp $CONFIG_FILE ./.config
          make defconfig -e

      - name: Compile
        id: compile
        run: |
          cd /home/runner/work/openwrt/openwrt/openwrt
          make download -j$(nproc) || make download -j1
          find dl -size -1024c -exec rm -f {} \;
          make tools/compile -j$(nproc) V=s || exit 1
          make -j$(nproc) 2>&1 | tee compile.log
          if [ $? -ne 0 ]; then make -j1 V=s; fi
          if [ -d "$FIRMWARE_OUTPUT_DIR" ] && ls "$FIRMWARE_OUTPUT_DIR"/*redmi_ax6* 2>/dev/null; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          else
              exit 1
          fi

      - name: Generate Firmware
        if: steps.compile.outputs.status == 'success'
        run: |
          cd $FIRMWARE_OUTPUT_DIR
          BUILD_TIME=${{ env.BUILD_TIME }}
          FIRMWARE_BIN=$(ls *redmi_ax6*.bin 2>/dev/null | head -1)
          if [ -z "$FIRMWARE_BIN" ]; then exit 1; fi
          dd if=/dev/zero of=ax6-256m.img bs=1M count=256
          dd if=$FIRMWARE_BIN of=ax6-256m.img bs=1M seek=251 conv=notrunc
          zip -r ax6-256m-${BUILD_TIME}.zip ax6-256m.img
          mkdir -p /home/runner/firmware
          cp *redmi_ax6*.bin ax6-256m-${BUILD_TIME}.zip /home/runner/firmware/
          gh release create AX6-256M-${BUILD_TIME} --title "Redmi AX6 256M ${BUILD_TIME}" --body "Redmi AX6 Firmware" /home/runner/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 关键修复：Line 202 改用单行路径，彻底避免列表语法错误
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: AX6-256M-Firmware-${{ env.BUILD_TIME }}
          path: /home/runner/firmware/*
          retention-days: 30
