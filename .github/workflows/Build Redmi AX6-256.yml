name: Build Redmi AX6 (256M)

on:
  push:
    branches: [juesure-patch-1]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: juesure-patch-1
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 原有逻辑...
          # 新增：升级 gh
          sudo apt update && sudo apt install -y gh
          # 验证 gh 版本
          gh --version
          # 清理冗余文件
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # 更新并安装依赖（修正：换行符后无多余空格）
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip
          # 设置时区
          sudo timedatectl set-timezone "$TZ"
          # 创建工作目录
          mkdir -p "$WORK_DIR" && chmod 777 "$WORK_DIR"
          # 校验脚本和配置文件
          if [ ! -f "$DIY_SCRIPT" ]; then 
              printf "❌ DIY script not found: %s\n" "$DIY_SCRIPT"
              exit 1
          fi
          chmod +x "$DIY_SCRIPT"
          if [ ! -f "$CONFIG_FILE" ]; then 
              printf "❌ Config file not found: %s\n" "$CONFIG_FILE"
              exit 1
          fi
          # 创建输出目录
          mkdir -p "$FIRMWARE_OUTPUT_DIR" && chmod 777 "$FIRMWARE_OUTPUT_DIR"

      # ========== 核心修复：Clone Source 步骤（解决 line7: -: command not found） ==========
      - name: Clone Source
        run: |
          # 切换到工作目录（绝对路径，无换行错误）
          cd "$WORK_DIR" || {
              printf "❌ 无法进入工作目录：%s\n" "$WORK_DIR"
              exit 1
          }
          # 克隆源码（修正：git clone 参数无换行/多余空格，改用 printf 输出日志）
          printf "🔧 开始克隆 OpenWrt 源码：%s (分支：%s)\n" "$REPO_URL" "$REPO_BRANCH"
          # 重试机制（修正：循环内命令无语法错误）
          for i in {1..3}; do
              # git clone 命令单行书写，避免换行导致参数解析错误
              git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt && break
              printf "⚠️ 克隆失败，重试 (%d/3)...\n" "$i"
              rm -rf openwrt
              sleep 5
          done
          # 校验克隆结果
          if [ ! -d "$WORK_DIR/openwrt" ]; then
              printf "❌ 源码克隆失败，目录不存在：%s\n" "$WORK_DIR/openwrt"
              exit 1
          fi
          # 创建软链接（绝对路径）
          ln -sf "$WORK_DIR/openwrt" /home/runner/work/openwrt/openwrt/openwrt
          chmod -R 755 "$WORK_DIR/openwrt"
          printf "✅ 源码克隆完成：%s\n" "$WORK_DIR/openwrt"

      - name: Preprocess
        run: |
          # 定义源码根目录
          OPENWRT_SRC="$WORK_DIR/openwrt"
          cd "$OPENWRT_SRC" || exit 1
          printf "🔧 当前工作目录：%s\n" "$(pwd)"
          # 执行 DIY 脚本
          "$DIY_SCRIPT" || {
              printf "❌ DIY 脚本执行失败\n"
              exit 1
          }
          # 修复 json_add_image_info.py
          JSON_FILE=$(find "$OPENWRT_SRC" -name "json_add_image_info.py" 2>/dev/null | head -1)
          if [ -n "$JSON_FILE" ]; then
              sed -i 's/return int(image_size)/return int(image_size, 0)/' "$JSON_FILE"
              printf "✅ 已修复：%s\n" "$JSON_FILE"
          else
              printf "⚠️ 未找到 json_add_image_info.py，跳过修复\n"
          fi
          # 禁用 fwupd（改用 printf 兼容所有 Shell）
          printf "%s\n" "CONFIG_PACKAGE_fwupd=n" "CONFIG_PACKAGE_fwupd-libs=n" "CONFIG_FWUPD_PLUGIN_FLASHROM=n" >> "$OPENWRT_SRC/.config"
          # 覆盖配置文件
          cp "$CONFIG_FILE" "$OPENWRT_SRC/.config"
          # 生成 defconfig
          make defconfig -e || exit 1
          printf "✅ Preprocess 步骤完成\n"

      - name: Compile
        id: compile
        run: |
          OPENWRT_SRC="$WORK_DIR/openwrt"
          cd "$OPENWRT_SRC" || exit 1
          # 下载依赖
          printf "📥 下载编译依赖...\n"
          make download -j$(nproc) || make download -j1
          find dl -size -1024c -exec rm -f {} \;
          # 编译工具链
          printf "🔨 编译工具链...\n"
          make tools/compile -j$(nproc) V=s || exit 1
          # 编译固件
          printf "🔨 编译固件（多线程）...\n"
          make -j$(nproc) 2>&1 | tee compile.log
          if [ $? -ne 0 ]; then
              printf "⚠️ 多线程编译失败，单线程重试...\n"
              make -j1 V=s
          fi
          # 校验结果
          if [ -d "$FIRMWARE_OUTPUT_DIR" ] && ls "$FIRMWARE_OUTPUT_DIR"/*redmi_ax6* 2>/dev/null; then
              printf "✅ 固件编译成功\n"
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          else
              printf "❌ 固件未生成\n"
              exit 1
          fi

          - name: Generate Firmware
            if: steps.compile.outputs.status == 'success'
            run: |
              # 可选：升级 gh 到最新版（解决参数兼容问题）
              sudo apt update && sudo apt install -y gh
              
              # 切换到固件输出目录
              cd "$FIRMWARE_OUTPUT_DIR" || exit 1
              BUILD_TIME="${{ env.BUILD_TIME }}"
              
              # 查找固件（宽松匹配）
              FIRMWARE_BIN=$(ls *redmi_ax6*.bin 2>/dev/null | head -1)
              if [ -z "$FIRMWARE_BIN" ]; then
                  printf "❌ 未找到 Redmi AX6 固件\n"
                  ls -l "$FIRMWARE_OUTPUT_DIR"
                  exit 1
              fi
              
              # 生成 256M 编程器固件（优化 seek 值，适配 AX6 分区）
              printf "📦 生成 256M 编程器固件...\n"
              dd if=/dev/zero of=ax6-256m.img bs=1M count=256
              # seek=251 对应 0x0FB40000（AX6 rootfs 起始地址）
              dd if="$FIRMWARE_BIN" of=ax6-256m.img bs=1M seek=251 conv=notrunc
              zip -r "ax6-256m-${BUILD_TIME}.zip" ax6-256m.img
              
              # 复制固件到统一目录
              mkdir -p /home/runner/firmware
              cp *redmi_ax6*.bin "ax6-256m-${BUILD_TIME}.zip" /home/runner/firmware/
              
              # ========== 核心修复：改用 --notes 替代 --body ==========
              # 旧版 gh 仅支持 -n/--notes，不支持 --body
              printf "🚀 发布固件到 GitHub Release...\n"
              gh release create "AX6-256M-${BUILD_TIME}" \
                --title "Redmi AX6 256M Firmware ${BUILD_TIME}" \
                --notes "### Redmi AX6 256M Flash Firmware
          - ax6-256m-${BUILD_TIME}.zip: 编程器刷写镜像（256M）
          - OpenWrt 原始固件: $(ls *redmi_ax6*.bin | head -1)" \
                /home/runner/firmware/* 2>/dev/null || {
                    printf "⚠️ Release 已存在，跳过发布\n"
                }
              printf "✅ 固件发布完成\n"
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: "AX6-256M-Firmware-${{ env.BUILD_TIME }}"
          path: /home/runner/firmware/*
          retention-days: 30
