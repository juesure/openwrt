name: Build Redmi AX6 (256M)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: 256M_FLASH_NOBAD_BLOCK
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [ 256M_FLASH_NOBAD_BLOCK ]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget libelf-dev \
            libfuse-dev device-tree-compiler mtd-utils squashfs-tools \
            dosfstools parted kmod zip gh lz4 lzop
          sudo timedatectl set-timezone "$TZ"
          mkdir -p "$WORK_DIR"
          chmod +x "$DIY_SCRIPT"

      - name: Clean Workdir
        run: |
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

      - name: Clone Source
        run: |
          cd "$WORK_DIR"
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Preprocess
        run: |
          cd "$WORK_DIR/openwrt"
          "$DIY_SCRIPT"
          cp "$CONFIG_FILE" .config
          # 添加UBI优化选项
          echo "CONFIG_MTD_UBI_FASTMAP=y" >> .config
          echo "CONFIG_MTD_UBI_BLOCK=y" >> .config
          make defconfig

      - name: Compile
        id: compile
        run: |
          cd "$WORK_DIR/openwrt"
          make download -j$(nproc)
          make -j$(nproc) V=s || make -j1 V=s
          
          # 检查生成的文件
          ls -la bin/targets/qualcommax/ipq807x/
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV

      - name: Package & Release
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p /home/runner/firmware
          cd "$FIRMWARE_OUTPUT_DIR"

          # 复制所有固件文件
          cp *sysupgrade.bin /home/runner/firmware/ 2>/dev/null
          cp *factory.ubi /home/runner/firmware/ 2>/dev/null
          cp *rootfs.ubi /home/runner/firmware/ 2>/dev/null
          
          # 如果UBI文件未生成，手动创建
          if [ ! -f /home/runner/firmware/*.ubi ]; then
            SYSUPGRADE_BIN=$(ls *sysupgrade.bin | head -1)
            if [ -n "$SYSUPGRADE_BIN" ]; then
              # 从sysupgrade.bin提取UBI（256M Flash偏移为4MB）
              dd if="$SYSUPGRADE_BIN" of=/home/runner/firmware/redmi_ax6_mtd12_ubi.bin bs=1M skip=4
            fi
          fi
          
          # 创建MD5校验文件
          cd /home/runner/firmware
          md5sum * > md5sum.txt
          
          # 发布到GitHub Release
          gh release create "AX6-256M-${{ env.BUILD_TIME }}" ./* -R ${GITHUB_REPOSITORY} --notes "Redmi AX6 256M Flash固件" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AX6-256M-Firmware
          path: /home/runner/firmware/*
