      - name: Create Release Notes
        run: |
          cat > /home/runner/RELEASE_NOTES.md << 'EOF'
## 固件说明
- 适配256MB Flash
- 包含LuCI中文界面
- UBI坏块管理优化

## 刷写方法
TTL执行: tftpboot 0x44000000 redmi_ax6_mtd12_ubi.bin; nand erase 0xa00000 0xf000000; nand write 0x44000000 0xa00000 0xf000000; reset
EOF

      - name: Package & Release
        # ... 其他配置 ...
        run: |
          # ... 复制文件 ...
          gh release create "$RELEASE_TAG" ./* \
            -R ${GITHUB_REPOSITORY} \
            --title "Redmi AX6 256M Flash 固件 $BUILD_TIME" \
            --notes-file /home/runner/RELEASE_NOTES.md \
            || echo "Release创建失败"
