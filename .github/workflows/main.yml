name: Build Redmi AX6 (256M)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: 256M_FLASH_NOBAD_BLOCK
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [ 256M_FLASH_NOBAD_BLOCK ]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        run: |
          sudo apt update -y >/dev/null 2>&1
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip gh >/dev/null 2>&1
          sudo timedatectl set-timezone "$TZ"
          mkdir -p "$WORK_DIR"
          chmod +x "$DIY_SCRIPT"

      - name: Clean Workdir
        run: |
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

      - name: Clone Source
        run: |
          cd "$WORK_DIR"
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Preprocess
        run: |
          cd "$WORK_DIR/openwrt"
          "$DIY_SCRIPT"
          cp "$CONFIG_FILE" .config
          make defconfig >/dev/null 2>&1

      - name: Compile
        id: compile
        run: |
          cd "$WORK_DIR/openwrt"
          make download -j$(nproc) >/dev/null 2>&1
          make -j$(nproc) || make -j1 V=s
          # 强制生成独立 UBI 镜像（如果未自动生成）
          if [ ! -f bin/targets/qualcommax/ipq807x/*rootfs.ubi ]; then
            # 手动生成 UBI 镜像（基于编译出的 rootfs.ubifs）
            ubimkvol -m -n rootfs -s 240MiB -o rootfs.ubi
            cp rootfs.ubi bin/targets/qualcommax/ipq807x/redmi_ax6_mtd12_ubi.bin
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV

      - name: Package & Release
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p /home/runner/firmware
          cd "$FIRMWARE_OUTPUT_DIR"

          # 1. 复制WEB升级用的sysupgrade.bin（100%保留）
          cp *sysupgrade.bin /home/runner/firmware/ 2>/dev/null

          # 2. 强制生成UBI救砖文件（核心修复：即使没编译出独立UBI，也从sysupgrade提取）
          SYSUPGRADE_BIN=$(ls *sysupgrade.bin | head -1)
          if [ -n "$SYSUPGRADE_BIN" ]; then
            # 从sysupgrade.bin中提取完整UBI镜像（IPQ807x标准偏移：4MB）
            dd if="$SYSUPGRADE_BIN" of=/home/runner/firmware/redmi_ax6_mtd12_ubi.bin bs=1M skip=4
            echo "✅ 成功提取UBI救砖文件：redmi_ax6_mtd12_ubi.bin"
          fi

          # 3. 发布所有文件到GitHub Release
          gh release create "AX6-256M-${{ env.BUILD_TIME }}" /home/runner/firmware/* -R ${GITHUB_REPOSITORY} 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AX6-256M-Firmware
          path: /home/runner/firmware/*
