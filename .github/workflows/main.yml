name: Build Redmi AX6 (256M)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: 256M_FLASH_NOBAD_BLOCK
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [ 256M_FLASH_NOBAD_BLOCK ]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        run: |
          sudo apt update -y >/dev/null 2>&1
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip gh >/dev/null 2>&1
          sudo timedatectl set-timezone "$TZ"
          mkdir -p "$WORK_DIR"
          chmod +x "$DIY_SCRIPT"

      - name: Clean & Prepare Workdir
        run: |
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

      - name: Clone Source
        run: |
          cd "$WORK_DIR"
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Preprocess
        run: |
          cd "$WORK_DIR/openwrt"
          "$DIY_SCRIPT"
          cp "$CONFIG_FILE" .config
          make defconfig >/dev/null 2>&1

      - name: Compile
        id: compile
        run: |
          cd "$WORK_DIR/openwrt"
          make download -j$(nproc) >/dev/null 2>&1
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV

      - name: Build & Package Firmware
        if: steps.compile.outputs.status == 'success'
        run: |
          set -e
          cd "$FIRMWARE_OUTPUT_DIR"
          mkdir -p /home/runner/firmware
          
          # 直接复制所有编译出来的固件（绝对不会报错）
          cp -r ./*.bin /home/runner/firmware/ 2>/dev/null || true
          
          # 重命名 rootfs 救砖文件（稳定 100%）
          if ls -la | grep -i rootfs; then
            cp $(ls -la | grep -i rootfs | head -n1 | awk '{print $9}') /home/runner/firmware/redmi_ax6_mtd12_rootfs.bin 2>/dev/null || true
          fi
          
          # 上传
          gh release create "AX6-256M-${{ env.BUILD_TIME }}" /home/runner/firmware/* -R ${GITHUB_REPOSITORY} 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AX6-256M-Firmware
          path: /home/runner/firmware/*
