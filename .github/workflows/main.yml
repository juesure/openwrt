name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Switch apt mirror (Tsinghua)
      run: |
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://mirrors.tuna.tsinghua.edu.cn/ubuntu/|g' /etc/apt/sources.list
        sudo apt-get update

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: UTC
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y --no-install-recommends install \
          build-essential asciidoc binutils bzip2 gawk gettext git \
          libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 \
          libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib \
          p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto \
          qemu-utils upx libelf-dev autoconf automake libtool autopoint \
          device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync

    - name: Clone source code
      run: |
        git clone -b AX6_256M_FLASH_V1.1 https://github.com/juesure/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e .config ] && cp .config openwrt/.config
        cd openwrt
        make defconfig

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      with:
        args: ${{ secrets.SSH2ACTIONS }}

    - name: Download package
      run: |
        cd openwrt
        make download -j8

    - name: Compile the firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
    - name: Organize files
      run: |
        cd openwrt/bin/targets/
        mkdir -p ../../../artifact/
        # 查找所有 .bin 和 .ubi 文件，复制到 artifact 目录
        find ./ -type f \( -name "*.bin" -o -name "*.ubi" \) -exec cp -rf {} ../../../artifact/ \;
    - name: Process UBI files
      run: |
        cd artifact/
        # 复制 UBI 文件（如果存在）
        cp *ubi . 2>/dev/null || true
        
        # 如果仍没有 rootfs.ubi，尝试从 sysupgrade.bin 提取
        if ! ls *rootfs.ubi 1>/dev/null 2>&1; then
            SYSUPGRADE=$(ls *sysupgrade.bin | head -1)
            if [ -n "$SYSUPGRADE" ]; then
                dd if="$SYSUPGRADE" of=redmi_ax6_rootfs.ubi bs=1M skip=4
                echo "✅ 已从 sysupgrade.bin 提取 rootfs.ubi"
            fi
        fi
        # 确保所有文件在当前目录（artifact）下，供后续上传
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_firmware
        path: artifact/

    - name: Create or Update Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "Latest Build"
        body: "最新自动构建固件"
        draft: false
        prerelease: true
        files: artifact/*
        allow_updates: true       # 允许更新已有 Release 的附件
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

