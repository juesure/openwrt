name: Build Redmi AX6 (256M)

# 全局环境变量（兼容 Node.js 24 + 路径配置）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: 256M_FLASH_NOBAD_BLOCK
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy-ax6-256m.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/ax6-256m.config
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [ 256M_FLASH_NOBAD_BLOCK ]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip gh
          sudo timedatectl set-timezone "$TZ"
          mkdir -p "$WORK_DIR" && chmod 777 "$WORK_DIR"
          [ ! -f "$DIY_SCRIPT" ] && { printf "❌ DIY脚本不存在\n"; exit 1; } && chmod +x "$DIY_SCRIPT"
          [ ! -f "$CONFIG_FILE" ] && { printf "❌ 配置文件不存在\n"; exit 1; }
          mkdir -p "$FIRMWARE_OUTPUT_DIR" && chmod 777 "$FIRMWARE_OUTPUT_DIR"

      - name: Clone Source
        run: |
          cd "$WORK_DIR" || { printf "❌ 进入工作目录失败\n"; exit 1; }
          for i in {1..3}; do git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt && break; rm -rf openwrt; sleep 5; done
          [ ! -d "$WORK_DIR/openwrt" ] && { printf "❌ 源码克隆失败\n"; exit 1; }
          ln -sf "$WORK_DIR/openwrt" /home/runner/work/openwrt/openwrt/openwrt
          chmod -R 755 "$WORK_DIR/openwrt"
          printf "✅ 源码克隆完成\n"

      - name: Preprocess
        run: |
          OPENWRT_SRC="$WORK_DIR/openwrt"
          cd "$OPENWRT_SRC" || exit 1
          printf "🔧 当前工作目录：%s\n" "$(pwd)"
          
          chmod +x "$DIY_SCRIPT"
          if [ ! -x "$DIY_SCRIPT" ]; then
              printf "❌ 赋予DIY脚本权限失败：%s\n" "$DIY_SCRIPT"
              exit 1
          fi
          
          "$DIY_SCRIPT" || {
              printf "❌ DIY脚本执行失败\n"
              cat "$DIY_SCRIPT" 2>/dev/null
              exit 1
          }
          
          JSON_FILE=$(find "$OPENWRT_SRC" -name "json_add_image_info.py" 2>/dev/null | head -1)
          if [ -n "$JSON_FILE" ]; then
              sed -i 's/return int(image_size)/return int(image_size, 0)/' "$JSON_FILE"
              printf "✅ 已修复：%s\n" "$JSON_FILE"
          else
              printf "⚠️ 未找到json_add_image_info.py，跳过修复\n"
          fi
          
          echo "CONFIG_PACKAGE_fwupd=n" >> "$OPENWRT_SRC/.config"
          echo "CONFIG_PACKAGE_fwupd-libs=n" >> "$OPENWRT_SRC/.config"
          echo "CONFIG_FWUPD_PLUGIN_FLASHROM=n" >> "$OPENWRT_SRC/.config"
          
          cp "$CONFIG_FILE" "$OPENWRT_SRC/.config"
          make defconfig -e
          printf "✅ Preprocess 步骤完成\n"

      - name: Compile
        id: compile
        run: |
          OPENWRT_SRC="$WORK_DIR/openwrt"
          cd "$OPENWRT_SRC" || exit 1
          printf "📥 下载编译依赖...\n"
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;
          
          printf "🔨 编译工具链...\n"
          make tools/compile -j$(nproc) V=s || { printf "❌ 工具链编译失败\n"; exit 1; }
          
          printf "🔨 编译固件（多线程）...\n"
          make -j$(nproc)
          COMPILE_STATUS=$?
          
          if [ $COMPILE_STATUS -ne 0 ]; then
              printf "⚠️ 多线程编译失败，单线程重试...\n"
              make -j1 V=s
              COMPILE_STATUS=$?
          fi
          
          if [ $COMPILE_STATUS -eq 0 ] && [ -d "$FIRMWARE_OUTPUT_DIR" ] && ls "$FIRMWARE_OUTPUT_DIR"/*redmi_ax6* 2>/dev/null; then
              printf "✅ 固件编译成功\n"
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          else
              printf "❌ 固件未生成\n"
              exit 1
          fi

      - name: Generate Firmware + Extract RootFS (MTD12 Rescue)
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "$FIRMWARE_OUTPUT_DIR" || exit 1
          BUILD_TIME="${{ env.BUILD_TIME }}"
          FIRMWARE_BIN=$(ls *redmi_ax6*.bin 2>/dev/null | head -1)
          [ -z "$FIRMWARE_BIN" ] && { printf "❌ 未找到固件\n"; exit 1; }
          
          printf "📦 生成256M编程器固件...\n"
          dd if=/dev/zero of=ax6-256m.img bs=1M count=256
          dd if="$FIRMWARE_BIN" of=ax6-256m.img bs=1M seek=0 conv=notrunc
          zip -r "ax6-256m-${BUILD_TIME}.zip" ax6-256m.img
          
          # ===================== 修复完成：自动提取 rootfs.bin =====================
          printf "📦 生成 MTD12 专用 rootfs.bin ...\n"
          find -name "*rootfs.img*" | head -1 | xargs -I {} cp {} rootfs.img.gz
          gzip -d rootfs.img.gz
          mv rootfs.img redmi_ax6_mtd12_rootfs.bin
          
          mkdir -p /home/runner/firmware
          cp *redmi_ax6*.bin "ax6-256m-${BUILD_TIME}.zip" /home/runner/firmware/
          cp redmi_ax6_mtd12_rootfs.bin /home/runner/firmware/
          
          gh release create "AX6-256M-${BUILD_TIME}" --title "Redmi AX6 256M ${BUILD_TIME}" --notes "✅ sysupgrade.bin\n✅ redmi_ax6_mtd12_rootfs.bin (救砖专用)\n✅ 256M编程器固件" /home/runner/firmware/* 2>/dev/null || printf "⚠️ Release已存在\n"
          printf "✅ 固件发布完成\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: "AX6-256M-Firmware-${{ env.BUILD_TIME }}"
          path: /home/runner/firmware/*
          retention-days: 30
