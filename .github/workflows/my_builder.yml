name: Redmi AX6 256M Build
env:
  REPO_URL: https://github.com/juesure/openwrt
  REPO_BRANCH: AX6_256M_FLASH_V1.1
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - AX6_256M_FLASH_V1.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: openwrt
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev device-tree-compiler

      - name: Clone source
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH lede

      - name: Prepare config
        run: |
          cd lede
          cp ../openwrt/config/my_config.sh .config
          cat >> .config << EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_DEVICE_redmi_ax6=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_PACKAGE_fwupd=n
          EOF
          make defconfig

      # ==========================================
      # 【✅ 终极正确修复】
      # 1. 从image Makefile删除坏设备，不编译它
      # 2. 修复DTS语法
      # ==========================================
      - name: Fix compilation
        run: |
          cd lede
          # 1. 从编译列表里删除 ipq8071-ap8220（永不编译）
          sed -i '/ipq8071-ap8220/d' target/linux/qualcommax/image/Makefile
          # 2. 修复edma时钟语法
          FILE=target/linux/qualcommax/dts/ipq8074.dtsi
          sed -i '178,180c\				clocks = <&gcc GCC_EDMA_CLK>, <&gcc GCC_EDMA_AXI_CLK>;\n				clock-names = "core", "axi";' $FILE

      - name: Compile firmware
        id: compile
        run: |
          cd lede
          export TERM=xterm
          make download -j$(nproc)
          make tools/compile -j$(nproc)
          make -j1 V=s IGNORE_ERRORS=1
          
          FIRMWARE=\$(find bin/targets/qualcommax/ipq807x -name "*redmi_ax6*" | head -1)
          if [ -n "\$FIRMWARE" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
            mkdir -p ../firmware
            cp \$FIRMWARE ../firmware/
            echo "✅ 固件已生成："
            ls ../firmware/
          fi

      - name: Upload artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AX6-256M-Firmware-${{ env.BUILD_TIME }}
          path: firmware/*
