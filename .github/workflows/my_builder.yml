name: Redmi AX6 256M Build
env:
  REPO_URL: https://github.com/juesure/openwrt
  REPO_BRANCH: AX6_256M_FLASH_V1.1
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - AX6_256M_FLASH_V1.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: openwrt
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev device-tree-compiler

      - name: Clone source
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH lede

      - name: Prepare config
        run: |
          cd lede
          cp ../openwrt/config/my_config.sh .config
          cat >> .config << EOF
          CONFIG_PACKAGE_fwupd=n
          CONFIG_PACKAGE_fwupd-libs=n
          CONFIG_FWUPD_PLUGIN_FLASHROM=n
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6=y
          EOF
          make defconfig

      # ==========================================
      # 【✅ 绝杀修复】全局替换 DTS 语法错误
      # 不看行号！直接修复所有错误格式！
      # ==========================================
      - name: Fix ALL DTS syntax errors
        run: |
          FILE="lede/target/linux/qualcommax/dts/ipq8074.dtsi"
          # 全局修复错误的 clocks 写法
          sed -i '/clocks = <&gcc GCC_EDMA_CLK>;/c\				clocks = <&gcc GCC_EDMA_CLK>, <&gcc GCC_EDMA_AXI_CLK>;' "$FILE"
          sed -i '/<&gcc GCC_EDMA_AXI_CLK>;/d' "$FILE"
          echo "✅ DTS 设备树已全局修复"

      - name: Compile firmware
        id: compile
        run: |
          cd lede
          export TERM=xterm
          make download -j$(nproc)
          make tools/compile -j$(nproc)
          make -j1 V=s IGNORE_ERRORS=1
          F=$(find bin/targets/qualcommax/ipq807x -name "*redmi_ax6*" | head -1)
          if [ -n "$F" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
            mkdir -p ../firmware
            cp $F ../firmware/
          fi

      - name: Upload artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AX6-256M-Firmware-${{ env.BUILD_TIME }}
          path: firmware/*
