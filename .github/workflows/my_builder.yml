name: Redmi AX6 (256M) Build 

# 全局环境变量（兼容 Node.js 24 + 路径配置）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: AX6_256M_FLASH_V1.1
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy_scripts.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/my_config.sh
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [AX6_256M_FLASH_V1.1]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt update -y && sudo apt full-upgrade -y && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev libfuse-dev device-tree-compiler mtd-utils squashfs-tools dosfstools parted kmod zip gh
          sudo timedatectl set-timezone "$TZ"
          mkdir -p "$WORK_DIR" && chmod 777 "$WORK_DIR"
          [ ! -f "$DIY_SCRIPT" ] && { printf "❌ DIY脚本不存在\n"; exit 1; } && chmod +x "$DIY_SCRIPT"
          [ ! -f "$CONFIG_FILE" ] && { printf "❌ 配置文件不存在\n"; exit 1; }
          mkdir -p "$FIRMWARE_OUTPUT_DIR" && chmod 777 "$FIRMWARE_OUTPUT_DIR"

      - name: Clone Source
        run: |
          cd "$WORK_DIR" || { printf "❌ 进入工作目录失败\n"; exit 1; }
          for i in {1..3}; do git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt && break; rm -rf openwrt; sleep 5; done
          [ ! -d "$WORK_DIR/openwrt" ] && { printf "❌ 源码克隆失败\n"; exit 1; }
          ln -sf "$WORK_DIR/openwrt" /home/runner/work/openwrt/openwrt/openwrt
          chmod -R 755 "$WORK_DIR/openwrt"
          printf "✅ 源码克隆完成\n"

      - name: Preprocess
        run: |
          OPENWRT_SRC="$WORK_DIR/openwrt"
          cd "$OPENWRT_SRC" || exit 1
          printf "🔧 当前工作目录：%s\n" "$(pwd)"
          
          chmod +x "$DIY_SCRIPT"
          if [ ! -x "$DIY_SCRIPT" ]; then
              printf "❌ 赋予DIY脚本权限失败：%s\n" "$DIY_SCRIPT"
              exit 1
          fi
          
          "$DIY_SCRIPT" || {
              printf "❌ DIY脚本执行失败（日志：）\n"
              cat "$DIY_SCRIPT" 2>/dev/null
              exit 1
          }
          
          # 修复json文件（解决image_size解析错误）
          JSON_FILE=$(find "$OPENWRT_SRC" -name "json_add_image_info.py" 2>/dev/null | head -1)
          if [ -n "$JSON_FILE" ]; then
              sed -i 's/return int(image_size)/return int(image_size, 0)/' "$JSON_FILE"
              printf "✅ 已修复：%s\n" "$JSON_FILE"
          else
              printf "⚠️ 未找到json_add_image_info.py，跳过修复\n"
          fi
          
          # 禁用fwupd（避免依赖缺失）
          printf "%s\n" "CONFIG_PACKAGE_fwupd=n" "CONFIG_PACKAGE_fwupd-libs=n" "CONFIG_FWUPD_PLUGIN_FLASHROM=n" >> "$OPENWRT_SRC/.config"
          
          cp "$CONFIG_FILE" "$OPENWRT_SRC/.config"
          make defconfig -e > /dev/null 2>&1
          printf "✅ Preprocess 步骤完成\n"

      - name: Compile
        id: compile
        run: |
          cd "$WORK_DIR/openwrt"
          
          # ========== 关键修复：修正DTS文件复制路径 ==========
          echo "🔧 修复设备树文件路径问题..."
          DTS_SRC="$WORK_DIR/openwrt/target/linux/qualcommax/dts"
          # 正确的目标目录：包含 linux-qualcommax_ipq807x 子目录
          DTS_DST="$WORK_DIR/openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq807x/dts"
          mkdir -p "$DTS_DST"
          # 复制所有 .dts 和 .dtsi 文件到正确路径
          cp -f "$DTS_SRC"/*.dts "$DTS_DST/" 2>/dev/null || true
          cp -f "$DTS_SRC"/*.dtsi "$DTS_DST/" 2>/dev/null || true
          echo "✅ 设备树文件已复制到 $DTS_DST"
          ls -lh "$DTS_DST/" || true
          # ========================================
          
          echo "📥 下载编译依赖..."
          make download -j$(nproc) 2>&1 | tee download.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ 下载依赖失败"
            tail -50 download.log
            exit 1
          fi
          
          echo "🔨 编译工具链..."
          make tools/compile -j$(nproc) V=s 2>&1 | tee toolchain.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ 工具链编译失败"
            tail -100 toolchain.log
            exit 1
          fi
          
          echo "🔨 编译固件（多线程）..."
          #make -j$(nproc) 2>&1 | tee compile.log
          make -j1 V=s 2>&1 | tee compile_single.log
          COMPILE_STATUS=${PIPESTATUS[0]}
          
          # 多线程失败则单线程重试
          if [ $COMPILE_STATUS -ne 0 ]; then
            echo "⚠️ 多线程编译失败，单线程重试..."
            make -j1 V=s 2>&1 | tee compile_single.log
            COMPILE_STATUS=${PIPESTATUS[0]}
          fi
          
          # 校验编译结果
          FIRMWARE_DIR="$WORK_DIR/openwrt/bin/targets/qualcommax/ipq807x"
          if [ $COMPILE_STATUS -eq 0 ] && [ -d "$FIRMWARE_DIR" ] && find "$FIRMWARE_DIR" -maxdepth 1 -name "*redmi_ax6*" | grep -q .; then
            echo "✅ 固件编译成功"
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
            ls -lh "$FIRMWARE_DIR"/*redmi_ax6*
          else
            echo "❌ 固件未生成"
            echo "编译日志最后200行："
            tail -200 compile.log
            exit 1
          fi

      - name: Generate Firmware
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "$FIRMWARE_OUTPUT_DIR" || exit 1
          BUILD_TIME="${{ env.BUILD_TIME }}"
          
          echo "📂 编译输出目录内容："
          ls -lh
          
          # 复制固件到输出目录
          mkdir -p /home/runner/firmware
          cp *redmi_ax6*.bin /home/runner/firmware/ 2>/dev/null || true
          cp *ubi /home/runner/firmware/ 2>/dev/null || true
          
          # 提取 rootfs.ubi（若未直接生成）
          if ! ls /home/runner/firmware/*rootfs.ubi 1>/dev/null 2>&1; then
              SYSUPGRADE=$(ls *sysupgrade.bin | head -1)
              if [ -n "$SYSUPGRADE" ]; then
                  dd if="$SYSUPGRADE" of=/home/runner/firmware/redmi_ax6_rootfs.ubi bs=1M skip=4
                  echo "✅ 已从 sysupgrade.bin 提取 rootfs.ubi"
              fi
          fi
          
          # 发布固件到 GitHub Release
          gh release create "AX6-256M-${BUILD_TIME}" --title "Redmi AX6 256M ${BUILD_TIME}" --notes "Redmi AX6 256M Firmware" /home/runner/firmware/* 2>/dev/null || printf "⚠️ Release已存在\n"
          printf "✅ 固件发布完成\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: "AX6-256M-Firmware-${{ env.BUILD_TIME }}"
          path: /home/runner/firmware/*
          retention-days: 30
