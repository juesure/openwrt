name: Redmi AX6 (256M) Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/juesure/openwrt/
  REPO_BRANCH: AX6_256M_FLASH_V1.1
  DIY_SCRIPT: /home/runner/work/openwrt/openwrt/scripts/diy_scripts.sh
  CONFIG_FILE: /home/runner/work/openwrt/openwrt/config/my_config.sh
  TZ: Asia/Shanghai
  WORK_DIR: /home/runner/work/openwrt/openwrt/workdir
  FIRMWARE_OUTPUT_DIR: /home/runner/work/openwrt/openwrt/workdir/openwrt/bin/targets/qualcommax/ipq807x

on:
  push:
    branches: [ AX6_256M_FLASH_V1.1 ]
  workflow_dispatch:

jobs:
  build-ax6-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: /home/runner/work/openwrt/openwrt
          fetch-depth: 1

      - name: Initialize Environment
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libelf-dev device-tree-compiler
          mkdir -p $WORK_DIR
          timedatectl set-timezone "$TZ"

      - name: Clone OpenWrt Source
        run: |
          cd $WORK_DIR
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Preprocess Configuration
        run: |
          cd $WORK_DIR/openwrt
          
          # 执行DIY脚本
          if [ -x "$DIY_SCRIPT" ]; then
            "$DIY_SCRIPT"
          fi
          
          # 修复Python脚本错误
          JSON_FILE=$(find . -name "json_add_image_info.py" 2>/dev/null | head -1)
          if [ -n "$JSON_FILE" ]; then
            sed -i 's/return int(image_size)/return int(image_size, 0)/' "$JSON_FILE"
          fi
          
          # ==============================================
          # 【关键】复制原有配置，不覆盖，只追加
          # ==============================================
          cp -f "$CONFIG_FILE" .config
          
          # 追加必要配置（不修改原有内容）
          cat >> .config << 'EOF'
CONFIG_PACKAGE_fwupd=n
CONFIG_PACKAGE_fwupd-libs=n
CONFIG_FWUPD_PLUGIN_FLASHROM=n
CONFIG_ALL_NONSHARED=n
CONFIG_AUTOREMOVE=n
CONFIG_COLLECT_KERNEL_DEBUG=n
CONFIG_DISABLE_MENUCONFIG=y

# 强制启用 Redmi AX6 设备
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq807x=y
CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6=y
EOF

          # 生成最终配置
          make defconfig -j1 V=s

      - name: Compile Firmware
        id: compile
        run: |
          cd $WORK_DIR/openwrt

          # 修复 DTS 设备树语法错误（ipq8074.dtsi）
          DTS_FILE="$WORK_DIR/openwrt/target/linux/qualcommax/dts/ipq8074.dtsi"
          sed -i '178,180c\				clocks = <&gcc GCC_EDMA_CLK>, <&gcc GCC_EDMA_AXI_CLK>;\n				clock-names = "core", "axi";' "$DTS_FILE"

          export TERM=xterm
          export NCURSES_NO_UTF8_ACS=1

          # 复制设备树文件
          DTS_SRC="$WORK_DIR/openwrt/target/linux/qualcommax/dts"
          DTS_DST1="$WORK_DIR/openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq807x/dts"
          DTS_DST2="$WORK_DIR/openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq807x/ipq807x-dts"
          mkdir -p "$DTS_DST1" "$DTS_DST2"
          cp -f "$DTS_SRC"/*.dts "$DTS_SRC"/*.dtsi "$DTS_DST1/" 2>/dev/null
          cp -f "$DTS_SRC"/*.dts "$DTS_SRC"/*.dtsi "$DTS_DST2/" 2>/dev/null

          # 开始编译
          make defconfig
          make download -j$(nproc)
          make tools/compile -j$(nproc)
          make -j1 V=s IGNORE_ERRORS=1 2>&1 | tee compile.log

          # 检查固件是否生成
          FIRMWARE_FILES=$(find "$WORK_DIR/openwrt/bin" -name "*redmi_ax6*" -type f)
          if [ -n "$FIRMWARE_FILES" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "BUILD_TIME=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
            ls -lh $FIRMWARE_FILES
          else
            echo "ERROR: Firmware not generated!"
            tail -200 compile.log
            exit 1
          fi

      - name: Prepare Firmware Files
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p /home/runner/firmware
          cp -f $FIRMWARE_OUTPUT_DIR/*redmi_ax6* /home/runner/firmware/ 2>/dev/null

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: AX6-256M-Firmware-${{ env.BUILD_TIME }}
          path: /home/runner/firmware/*
          retention-days: 30
